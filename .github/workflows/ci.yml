name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test-c:
    name: C Tests (GCC ${{ matrix.gcc-version }}, ${{ matrix.build-type }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: gcc:${{ matrix.gcc-version }}
    strategy:
      fail-fast: false
      matrix:
        gcc-version: [13, 14, 15, 16]
        build-type: [Debug, Release]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        apt update
        apt install -y cmake
    
    - name: Verify GCC version
      run: |
        gcc --version
        g++ --version
        gcc -dumpversion
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DDYNEMIT_BUILD_TESTS=ON
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }} -j$(nproc)
    
    - name: Run C tests
      run: |
        cd build
        ctest --output-on-failure --verbose -R "^test_(features|vector_ops|thread_safe_detection|resolver_macro)$"
    
    - name: List features
      run: |
        cmake -B build-list -DLIST_FEATURES=ON || true

  build-and-test-c-musl:
    name: C Tests (musl/Alpine, Release, x86_64)
    runs-on: ubuntu-latest
    container: alpine:3.22

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: apk add --no-cache build-base cmake linux-headers git

    - name: Verify GCC version
      run: |
        gcc --version
        ldd --version || true

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DDYNEMIT_BUILD_TESTS=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run C tests
      run: |
        cd build
        ctest --output-on-failure --verbose -R "^test_(features|vector_ops|thread_safe_detection|resolver_macro)$"

  build-and-test-cpp:
    name: C++ Tests (GCC ${{ matrix.gcc-version }}, ${{ matrix.build-type }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: gcc:${{ matrix.gcc-version }}
    strategy:
      fail-fast: false
      matrix:
        gcc-version: [13, 14, 15, 16]
        build-type: [Debug, Release]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        apt update
        apt install -y cmake
    
    - name: Verify GCC/G++ version
      run: |
        gcc --version
        g++ --version
        gcc -dumpversion
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DDYNEMIT_BUILD_TESTS=ON
    
    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }} -j$(nproc)
    
    - name: Run C++ tests
      run: |
        cd build
        ctest --output-on-failure --verbose -R "^test_cpp_"

  build-and-test-c-clang:
    name: C Tests (Clang ${{ matrix.clang-version }}, ${{ matrix.build-type }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        clang-version: [17, 18, 19, 20, 21]
        build-type: [Debug, Release]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add LLVM apt repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.clang-version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list

    - name: Install Clang ${{ matrix.clang-version }}
      run: |
        sudo apt update
        sudo apt install -y clang-${{ matrix.clang-version }} lld-${{ matrix.clang-version }}

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Verify Clang version
      run: |
        clang-${{ matrix.clang-version }} --version

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DDYNEMIT_BUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=clang-${{ matrix.clang-version }} \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang-version }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }} -j$(nproc)

    - name: Run C tests
      run: |
        cd build
        ctest --output-on-failure --verbose -R "^test_(features|vector_ops|thread_safe_detection|resolver_macro)$"

  build-and-test-cpp-clang:
    name: C++ Tests (Clang ${{ matrix.clang-version }}, ${{ matrix.build-type }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        clang-version: [17, 18, 19, 20, 21]
        build-type: [Debug, Release]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add LLVM apt repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${{ matrix.clang-version }} main" | sudo tee /etc/apt/sources.list.d/llvm.list

    - name: Install Clang ${{ matrix.clang-version }}
      run: |
        sudo apt update
        sudo apt install -y clang-${{ matrix.clang-version }} lld-${{ matrix.clang-version }}

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Verify Clang version
      run: |
        clang++-${{ matrix.clang-version }} --version

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
          -DDYNEMIT_BUILD_TESTS=ON \
          -DCMAKE_C_COMPILER=clang-${{ matrix.clang-version }} \
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang-version }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }} -j$(nproc)

    - name: Run C++ tests
      run: |
        cd build
        ctest --output-on-failure --verbose -R "^test_cpp_"

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc-13 g++-13 clang-format cppcheck
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
    
    - name: Check formatting
      run: |
        find src include features tests bench -name '*.c' -o -name '*.h' | \
        xargs clang-format --dry-run --Werror 2>/dev/null || \
        echo "Note: clang-format check skipped or has minor issues"
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,style,performance,portability \
          --error-exitcode=0 \
          --inline-suppr \
          -I include \
          src/ features/ tests/ 2>&1 | tee cppcheck-report.txt
    
    - name: Upload cppcheck results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cppcheck-report
        path: cppcheck-report.txt

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add LLVM apt repository
      run: |
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list

    - name: Install Clang 21 and clang-tidy
      run: |
        sudo apt update
        sudo apt install -y clang-21 clang-tidy-21

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Configure CMake
      run: |
        cmake -B build-tidy \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang-21 \
          -DCMAKE_CXX_COMPILER=clang++-21

    - name: Run clang-tidy
      run: |
        run-clang-tidy-21 -p build-tidy \
          'features/[^/]+/[^/]+\.c' 2>&1 | tee clang-tidy-report.txt

    - name: Upload clang-tidy report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clang-tidy-report
        path: clang-tidy-report.txt

  simd-verification:
    name: SIMD Instruction Verification (x86_64)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install GCC 13
      run: |
        sudo apt update
        sudo apt install -y gcc-13 g++-13 binutils
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
    
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'
    
    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
        cmake --build build -j$(nproc)
    
    - name: Check for SIMD instructions
      run: |
        chmod +x scripts/check_for_simd.sh
        found=0
        for bin in $(find build -type f -executable -not -path "*/_deps/*" \( -name 'bench_*' -o -name 'test_*' \) 2>/dev/null); do
          ./scripts/check_for_simd.sh "$bin" || true
          found=1
        done
        [ "$found" -eq 0 ] && echo "No test/bench binaries found under build/"
        true

    - name: Verify object files contain SIMD
      run: |
        echo "=== Checking for SIMD instructions in object files ==="
        for obj in $(find build -name "*.o" -not -path "*/_deps/*"); do
          if objdump -d "$obj" 2>/dev/null | grep -qE '(vmovups|vmovaps|vmovdqu|vaddp[sd]|vmulp[sd]|vsubp[sd]|vfmadd|vpxor|vpmaxu)'; then
            echo "Found SIMD in: $obj"
          fi
        done
        echo "SIMD object file check complete"

  simd-verification-arm:
    name: SIMD Instruction Verification (aarch64)
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC 13
      run: |
        sudo apt update
        sudo apt install -y gcc-13 g++-13 binutils
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
        cmake --build build -j$(nproc)

    - name: Check for SIMD instructions
      run: |
        chmod +x scripts/check_for_simd.sh
        found=0
        for bin in $(find build -type f -executable -not -path "*/_deps/*" \( -name 'bench_*' -o -name 'test_*' \) 2>/dev/null); do
          ./scripts/check_for_simd.sh "$bin" || true
          found=1
        done
        [ "$found" -eq 0 ] && echo "No test/bench binaries found under build/"
        true

    - name: Verify object files contain SIMD
      run: |
        echo "=== Checking for ARM SIMD instructions in object files ==="
        for obj in $(find build -name "*.o" -not -path "*/_deps/*"); do
          if objdump -d "$obj" 2>/dev/null | grep -qE '([{]v[0-9]|v[0-9]+\.[0-9]+[bhsd]|whilelo|ptrue|[{]z[0-9])'; then
            echo "Found SIMD in: $obj"
          fi
        done
        echo "ARM SIMD object file check complete"

  consumer-install-smoke:
    name: Consumer Install Smoke
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake pkg-config g++

    - name: Run consumer install smoke
      run: ./scripts/consumer_smoke.sh

  build-docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Validate documentation
      run: |
        echo "Checking documentation files..."
        test -f README.md
        test -f docs/ARCHITECTURE.md
        echo "All documentation files present"
    
    - name: Check for broken links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/workflows/markdown-link-check.json'
      continue-on-error: true

  build-artifacts:
    name: Build & Archive Artifacts (x86_64)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install GCC 13
      run: |
        sudo apt update
        sudo apt install -y gcc-13 g++-13
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
    
    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'
    
    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
        cmake --build build -j$(nproc)
    
    - name: Package libraries
      run: |
        mkdir -p artifacts/lib artifacts/include
        cp -r build/src/*.a build/features/*/*.a artifacts/lib/ || true
        cp -r include/* artifacts/include/
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libdynemit-libraries-x86_64
        path: artifacts/
        retention-days: 10

  build-artifacts-arm:
    name: Build & Archive Artifacts (aarch64)
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC 13
      run: |
        sudo apt update
        sudo apt install -y gcc-13 g++-13
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100

    - name: Install CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_CXX_COMPILER=g++-13
        cmake --build build -j$(nproc)

    - name: Package libraries
      run: |
        mkdir -p artifacts/lib artifacts/include
        cp -r build/src/*.a build/features/*/*.a artifacts/lib/ || true
        cp -r include/* artifacts/include/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libdynemit-libraries-aarch64
        path: artifacts/
        retention-days: 10
