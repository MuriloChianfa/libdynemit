name: "libdynemit CodeQL config"

paths:
  - src
  - features
  - include

paths-ignore:
  - tests
  - bench
  - build
  - docs
  - scripts
  - '**/*.md'
  - '**/googletest-src/**'
  - '**/gtest/**'
  - '**/gmock/**'
  - '**/build/_deps/**'

queries:
  - uses: security-extended
  - uses: security-and-quality

query-filters:
  - exclude:
      id: cpp/unused-static-function
